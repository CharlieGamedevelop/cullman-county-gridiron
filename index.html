<style>

<canvas id="c"></canvas><button id="mute" aria-label="Mute">🔊</button>
<script>
(()=>{
'use strict';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=960,H=540;let S=1,OX=0,OY=0,DPR=1;
function resize(){DPR=Math.min(devicePixelRatio||1,2);cv.width=innerWidth*DPR;cv.height=innerHeight*DPR;S=Math.min(innerWidth/W,innerHeight/H);OX=(innerWidth-W*S)/2;OY=(innerHeight-H*S)/2;}
addEventListener('resize',resize);resize();
// Teams verified via AHSFHS.org team pages and MaxPreps (St. Bernard)
const TEAMS=[
 {id:'cul',name:'Cullman',mascot:'Bearcats',ab:'CUL',c1:'#141414',c2:'#f2b705',hl:'#f2b705'},
 {id:'han',name:'Hanceville',mascot:'Bulldogs',ab:'HAN',c1:'#4b2a85',c2:'#f2b705',hl:'#f2b705'},
 {id:'gh',name:'Good Hope',mascot:'Raiders',ab:'GH',c1:'#c8102e',c2:'#ffffff',hl:'#ffffff'},
 {id:'vin',name:'Vinemont',mascot:'Eagles',ab:'VIN',c1:'#a6192e',c2:'#ffffff',hl:'#a6192e'},
 {id:'hp',name:'Holly Pond',mascot:'Broncos',ab:'HP',c1:'#0b6b3a',c2:'#ffffff',hl:'#ffffff'},
 {id:'fv',name:'Fairview',mascot:'Aggies',ab:'FV',c1:'#5a2d91',c2:'#e6b325',hl:'#e6b325'},
 {id:'wp',name:'West Point',mascot:'Warriors',ab:'WP',c1:'#7a1f2b',c2:'#ffffff',hl:'#7a1f2b'},
 {id:'cs',name:'Cold Springs',mascot:'Eagles',ab:'CS',c1:'#1f4fa3',c2:'#f2b705',hl:'#f2b705'},
 {id:'sb',name:'St. Bernard',mascot:'Saints',ab:'SB',c1:'#1b2a55',c2:'#ffffff',hl:'#ffffff'}];
let wins={};try{wins=JSON.parse(localStorage.getItem('ccfWins')||'{}')}catch(e){}
// ---------- audio
let muted=localStorage.getItem('ccfMute')==='1',ac=null,crowdG=null;
function au(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();const len=ac.sampleRate*2,b=ac.createBuffer(1,len,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
 window.__nb=b;const s=ac.createBufferSource();s.buffer=b;s.loop=true;const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=900;f.Q.value=.6;crowdG=ac.createGain();crowdG.gain.value=muted?0:.035;s.connect(f).connect(crowdG).connect(ac.destination);s.start();}catch(e){}}
 if(ac&&ac.state==='suspended')ac.resume();}
function cheer(v=.22,d=2){if(!crowdG||muted)return;const n=ac.currentTime;crowdG.gain.cancelScheduledValues(n);crowdG.gain.setValueAtTime(crowdG.gain.value,n);crowdG.gain.linearRampToValueAtTime(v,n+.25);crowdG.gain.linearRampToValueAtTime(.035,n+d);}
function whistle(){if(muted||!ac)return;const n=ac.currentTime,o=ac.createOscillator(),l=ac.createOscillator(),lg=ac.createGain(),g=ac.createGain();o.frequency.value=2900;l.frequency.value=28;lg.gain.value=180;l.connect(lg).connect(o.frequency);
 g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(.06,n+.02);g.gain.setValueAtTime(.06,n+.32);g.gain.linearRampToValueAtTime(0,n+.4);o.connect(g).connect(ac.destination);o.start(n);l.start(n);o.stop(n+.42);l.stop(n+.42);}
function thud(){if(muted||!ac||!window.__nb)return;const n=ac.currentTime,s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=window.__nb;f.type='lowpass';f.frequency.value=260;g.gain.setValueAtTime(.5,n);g.gain.exponentialRampToValueAtTime(.001,n+.18);s.connect(f).connect(g).connect(ac.destination);s.start(n);s.stop(n+.2);}
function horn(){if(muted||!ac)return;const n=ac.currentTime;[233,294,349].forEach(fr=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sawtooth';o.frequency.value=fr;g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(.035,n+.05);g.gain.setValueAtTime(.035,n+.7);g.gain.linearRampToValueAtTime(0,n+.9);o.connect(g).connect(ac.destination);o.start(n);o.stop(n+.95)});}
function blip(f=660){if(muted||!ac)return;const n=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.06,n);g.gain.exponentialRampToValueAtTime(.001,n+.12);o.connect(g).connect(ac.destination);o.start(n);o.stop(n+.13);}
const mb=document.getElementById('mute');const setM=()=>{mb.textContent=muted?'🔇':'🔊';if(crowdG)crowdG.gain.value=muted?0:.035};setM();
mb.addEventListener('pointerdown',e=>{e.stopPropagation();au();muted=!muted;localStorage.setItem('ccfMute',muted?'1':'0');setM();});
// ---------- state
const FW=53.3,PPY=10.4;
let scene='select',pickStep=0,selA=-1,selB=-1,hov=0,home,away,t=0;
let G=null,ents=[],ball=null,carrier=null,ctrl=null,parts=[],btns=[],msg=null,camX=35,camY=26.6;
const keys={};let joy={on:false,id:null,bx:0,by:0,x:0,y:0};
function newGame(){G={score:[0,0],q:1,clock:120,poss:0,los:35,firstX:45,down:1,phase:'pre',play:null,pt:0,cpuT:0,fg:null,over:false,juCD:0,spCD:0,lastRes:''};setupPlay();cheer(.2,2.5);horn();}
const dir=()=>G.poss===0?1:-1;
const goalX=()=>G.poss===0?110:10;
function teamOf(side){return side===0?home:away}
function mk(side,role,x,y,num){return{side,role,x,y,vx:0,vy:0,num,stun:0,eng:null,engT:0,shed:0,ang:side===G.poss?(dir()>0?0:Math.PI):(dir()>0?Math.PI:0),route:null,ri:0,spin:0,juke:0,jx:0,jy:0,missed:false}}
function setupPlay(){const d=dir(),L=G.los,o=G.poss,df=1-o;ents=[];ball=null;carrier=null;msg=msg&&msg.keep?msg:null;
 const qb=mk(o,'QB',L-d*4.5,26.6,o?12:7),rb=mk(o,'RB',L-d*7,29.5,o?22:28),w1=mk(o,'WR',L-d*1,9,o?81:11),w2=mk(o,'WR',L-d*1,44,o?84:3),ol=mk(o,'OL',L-d*1.2,26.6,o?55:72);
 w1.tag=1;w2.tag=2;rb.tag=3;
 w1.route=[[L+d*9,9],[L+d*13,20],[L+d*30,22]];w2.route=[[L+d*22,43],[L+d*45,40]];rb.route=[[L-d*3,40],[L+d*6,46],[L+d*25,46]];
 ents.push(qb,rb,w1,w2,ol);
 const dl1=mk(df,'DL',L+d*1.4,23.5,o?90:94),dl2=mk(df,'DL',L+d*1.4,30,o?99:91),lb=mk(df,'LB',L+d*5.5,26.6,o?44:52),db1=mk(df,'DB',L+d*7,11,o?21:24),db2=mk(df,'DB',L+d*8,42,o?2:5);
 db1.cover=w1;db2.cover=w2;lb.cover=rb;ents.push(dl1,dl2,lb,db1,db2);
 G.phase='pre';G.play=null;G.pt=0;G.cpuT=0;G.thrown=false;
 ctrl=o===0?null:lb;camX=L+d*6;}
function snap(type){if(G.phase!=='pre')return;au();G.play=type;G.phase='live';G.pt=0;whistle();
 const qb=ents.find(e=>e.role==='QB'&&e.side===G.poss),rb=ents.find(e=>e.role==='RB'&&e.side===G.poss);
 if(type==='run'){carrier=rb;rb.route=null;}else{carrier=null;}
 if(G.poss===0)ctrl=type==='run'?rb:qb;}
// ---------- input
function inputVec(){let x=0,y=0;if(keys.ArrowLeft||keys.KeyA)x--;if(keys.ArrowRight||keys.KeyD)x++;if(keys.ArrowUp||keys.KeyW)y--;if(keys.ArrowDown||keys.KeyS)y++;
 if(joy.on){const dx=joy.x-joy.bx,dy=joy.y-joy.by,m=Math.hypot(dx,dy);if(m>8){x=dx/Math.max(m,45);y=dy/Math.max(m,45);}}
 const m=Math.hypot(x,y);if(m>1){x/=m;y/=m}return[x,y];}
function action(a){au();
 if(scene==='select')return;
 if(scene==='final'){return}
 if(G.phase==='pre'&&G.poss===0){if(a==='run'||a==='pass')snap(a);if(a==='kick')kickChoice();return;}
 if(G.phase==='fg'&&G.fg&&!G.fg.done&&a==='act'){fgKick();return}
 if(G.phase==='msg'&&a==='act'&&G.msgT<1.6){G.msgT=Math.min(G.msgT,.15);return}
 if(G.phase!=='live')return;
 if(G.poss===0){
  if(['t1','t2','t3'].includes(a)&&G.play==='pass'&&!carrier&&!ball){const tg=ents.find(e=>e.tag===+a[1]&&e.side===0);if(tg)throwTo(tg);}
  if(a==='juke'&&carrier===ctrl&&G.juCD<=0)doJuke(ctrl);
  if(a==='spin'&&carrier===ctrl&&G.spCD<=0){ctrl.spin=.45;G.spCD=2.2;blip(520)}
  if(a==='act'&&G.play==='pass'&&!carrier&&!ball){ // auto throw to most open
   const tg=mostOpen(0);if(tg)throwTo(tg);}
 }else if(a==='act'){ // switch defender
  const tgt=carrier||ball&&{x:ball.tx,y:ball.ty}||ents.find(e=>e.role==='QB'&&e.side===1);let best=null,bd=1e9;
  for(const e of ents)if(e.side===0&&e!==ctrl){const dd=Math.hypot(e.x-tgt.x,e.y-tgt.y);if(dd<bd){bd=dd;best=e}}if(best){ctrl=best;blip(880)}}}
const KM={Space:'act',Enter:'act',KeyR:'run',KeyP:'pass',KeyF:'kick',Digit1:'t1',Digit2:'t2',Digit3:'t3',KeyJ:'juke',KeyK:'spin',ShiftLeft:'juke',ShiftRight:'spin'};
addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.repeat)return;
 if(scene==='select'){if(e.code==='ArrowRight')hov=(hov+1)%9;if(e.code==='ArrowLeft')hov=(hov+8)%9;if(e.code==='ArrowDown')hov=(hov+3)%9;if(e.code==='ArrowUp')hov=(hov+6)%9;if(e.code==='Enter'||e.code==='Space'){if(selA>=0&&selB>=0&&pickStep===2)startGame();else pickTeam(hov);}return;}
 if(scene==='final'&&(e.code==='Enter'||e.code==='Space')){startGame();return}
 if(KM[e.code])action(KM[e.code]);});
addEventListener('keyup',e=>{keys[e.code]=false});
function toCanvas(e){return[(e.clientX-OX)/S,(e.clientY-OY)/S]}
cv.addEventListener('pointerdown',e=>{au();const[x,y]=toCanvas(e);
 for(const b of btns)if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){b.fn();b.flash=.15;return}
 if(scene==='play'&&x<W*.5&&e.pointerType!=='mouse'){joy={on:true,id:e.pointerId,bx:x,by:y,x,y};return}
 if(scene==='play')action('act');});
cv.addEventListener('pointermove',e=>{if(joy.on&&e.pointerId===joy.id){const[x,y]=toCanvas(e);joy.x=x;joy.y=y;}});
const endJ=e=>{if(e.pointerId===joy.id)joy.on=false};addEventListener('pointerup',endJ);addEventListener('pointercancel',endJ);
function pickTeam(i){if(pickStep===0){selA=i;pickStep=1;blip(700)}else if(pickStep>=1){if(i===selA)return;selB=i;pickStep=2;blip(900)}}
function startGame(){if(selA<0||selB<0)return;home=TEAMS[selA];away=TEAMS[selB];scene='play';msg=null;newGame();showMsg('KICKOFF',home.name+' ball first',home.c1,1.6);}
// ---------- gameplay helpers
function mostOpen(side){let best=null,bs=-1;for(const e of ents)if(e.side===side&&e.tag){let md=1e9;for(const d of ents)if(d.side!==side)md=Math.min(md,Math.hypot(d.x-e.x,d.y-e.y));
 const adv=(e.x-G.los)*dir();const sc=md+adv*.08;if(sc>bs){bs=sc;best=e}}return best}
function throwTo(tg){const qb=ents.find(e=>e.role==='QB'&&e.side===G.poss);if(!qb||G.thrown)return;G.thrown=true;
 let tx=tg.x,ty=tg.y,T=0;for(let i=0;i<3;i++){const d=Math.hypot(tx-qb.x,ty-qb.y);T=d/24+.18;tx=tg.x+tg.vx*T;ty=tg.y+tg.vy*T;}
 ty=Math.max(1,Math.min(FW-1,ty));ball={sx:qb.x,sy:qb.y,tx,ty,t:0,T,tg};blip(400);}
function doJuke(e){const[ix,iy]=inputVec();let sy=iy!==0?Math.sign(iy):(Math.random()<.5?-1:1);e.juke=.22;e.jx=dir()*.35;e.jy=sy;G.juCD=1.1;blip(760);
 for(const d of ents)if(d.side!==e.side&&Math.hypot(d.x-e.x,d.y-e.y)<2.6&&Math.random()<.7){d.stun=.6;puff(d.x,d.y,'#fff',6)}}
function puff(x,y,c,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=2+Math.random()*6;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.4+Math.random()*.3,c,r:1.5+Math.random()*2,w:1})}}
function confetti(cols){for(let i=0;i<140;i++)parts.push({sx:Math.random()*W,sy:-20-Math.random()*200,vx:(Math.random()-.5)*60,vy:120+Math.random()*120,l:3+Math.random(),c:cols[i%cols.length],r:3+Math.random()*3,scr:1,rot:Math.random()*6})}
function showMsg(a,b,c,d=2){msg={a,b,c,T:d,t:0}}
function endPlay(kind,x){if(G.phase!=='live')return;G.phase='dead';whistle();
 const d=dir();let gained=(x-G.los)*d;let text='',sub='';
 if(kind==='td'){G.score[G.poss]+=7;const T=teamOf(G.poss);showMsg('TOUCHDOWN',T.name+' '+T.mascot+' score! Extra point is good.',T.c1,2.6);confetti([T.c1,T.c2,'#fff']);cheer(.35,3.5);horn();G.after='kickoff';G.clock-=6;finishTimer(2.6);return;}
 if(kind==='int'){showMsg('INTERCEPTED',teamOf(1-G.poss).name+' picks it off!',teamOf(1-G.poss).c1,2);cheer(.3,2.5);G.clock-=5;G.after={turn:x};finishTimer(2);return;}
 if(kind==='inc'){showMsg('INCOMPLETE','',null,1.1);G.lastRes='Incomplete pass';adv(0,true);finishTimer(1.1);return;}
 if(d>0&&x<10||d<0&&x>110){G.score[1-G.poss]+=2;showMsg('SAFETY','Two points for '+teamOf(1-G.poss).name,teamOf(1-G.poss).c1,2.2);cheer(.3,2.5);G.after='safety';finishTimer(2.2);return;}
 G.lastRes=(gained>=0?'Gain of ':'Loss of ')+Math.abs(Math.round(gained))+' yards';
 if(kind==='oob')adv(x,true);else adv(x,false);
 finishTimer(kind==='sack'?1.4:1.1);if(kind==='sack')showMsg('SACKED','',teamOf(1-G.poss).c1,1.3);
 if(gained>=15){cheer(.25,2)}}
function adv(x,stop){const d=dir();if(x===0)x=G.los;G.clock-=stop?1:6;
 const newL=x;if((newL-G.firstX)*d>=0){G.down=1;G.los=newL;G.firstX=clampG(newL+d*10);if(G.lastRes)G.lastRes+='. First down!';G.after='next';return;}
 G.los=newL;G.down++;if(G.down>4){G.after={turn:newL,downs:1};}else G.after='next';}
function clampG(x){return Math.max(10,Math.min(110,x))}
function finishTimer(s){G.msgT=s;G.phase='msg';}
function nextAfter(){const a=G.after;G.after=null;
 if(a==='kickoff'||a==='safety'){if(a==='safety'){G.los=G.poss===0?35:85;}else{G.poss^=1;G.los=G.poss===0?35:85;}G.down=1;G.firstX=G.los+dir()*10;}
 else if(a&&a.turn!==undefined){G.poss^=1;G.los=Math.max(11,Math.min(109,a.turn));G.down=1;G.firstX=clampG(G.los+dir()*10);if(a.downs)showMsg('TURNOVER ON DOWNS','',null,1.4);}
 if(G.clock<=0){G.q++;G.clock=120;if(G.q===3){G.poss=1;G.los=85;G.down=1;G.firstX=75;showMsg('HALFTIME',home.ab+' '+G.score[0]+'   '+away.ab+' '+G.score[1],'#1d3557',2.2);}
  else if(G.q>4){return finalWhistle()}else showMsg('END OF QUARTER '+(G.q-1),'',null,1.5);}
 setupPlay();}
function finalWhistle(){scene='final';whistle();horn();const[a,b]=G.score;let res;
 if(a>b){wins[home.id]=(wins[home.id]||0)+1;res=home.name+' wins!';confetti([home.c1,home.c2,'#fff']);cheer(.4,4)}else if(b>a){wins[away.id]=(wins[away.id]||0)+1;res=away.name+' wins!'}else res='It ends in a tie!';
 localStorage.setItem('ccfWins',JSON.stringify(wins));G.res=res;}
function kickChoice(){const fgD=(goalX()-G.los)*dir()+17;if(fgD<=55){G.phase='fg';G.fg={dist:fgD,n:0,v:1,done:false,t:0,tol:Math.max(.08,.42-fgD*.0062)};}else punt();}
function punt(){const d=dir();let x=G.los+d*(36+Math.random()*10);if(d>0&&x>=110||d<0&&x<=10)x=d>0?90:30;G.phase='msg';G.msgT=1.6;showMsg('PUNT',teamOf(G.poss).name+' punts it away','#334',1.6);G.after={turn:x};}
function fgKick(){const f=G.fg;f.done=true;f.good=Math.abs(f.n)<f.tol;f.t=0;blip(300);}
function cpuFG(){const fgD=(goalX()-G.los)*dir()+17;G.phase='fg';G.fg={dist:fgD,done:true,t:0,good:Math.random()<Math.max(.15,1.15-fgD/50),cpu:1};}
// ---------- AI / physics
function seek(e,tx,ty,sp){const dx=tx-e.x,dy=ty-e.y,m=Math.hypot(dx,dy)||1;return[dx/m*sp,dy/m*sp,m]}
function update(dt){t+=dt;for(const b of btns)if(b.flash)b.flash-=dt;
 for(const p of parts){if(p.scr){p.sx+=p.vx*dt;p.sy+=p.vy*dt;p.rot+=dt*5}else{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.92;p.vy*=.92}p.l-=dt}parts=parts.filter(p=>p.l>0);
 if(msg){msg.t+=dt;if(msg.t>msg.T)msg=null}
 if(scene!=='play')return;
 G.juCD-=dt;G.spCD-=dt;
 if(G.phase==='msg'){G.msgT-=dt;if(G.msgT<=0)nextAfter();camFollow(dt);return}
 if(G.phase==='fg'){const f=G.fg;if(!f.done){f.n+=f.v*dt*1.9;if(Math.abs(f.n)>1){f.v*=-1;f.n=Math.sign(f.n)}}else{f.t+=dt;if(f.t>1.3&&!f.res){f.res=1;
   if(f.good){G.score[G.poss]+=3;const T=teamOf(G.poss);showMsg('FIELD GOAL IS GOOD','From '+Math.round(f.dist)+' yards out',T.c1,2.2);cheer(.3,2.5);horn();G.after='kickoff';}
   else{showMsg('NO GOOD','The kick sails wide',null,1.8);G.after={turn:G.los};}G.clock-=5;G.phase='msg';G.msgT=2.2;}}camFollow(dt);return}
 if(G.phase==='pre'){camFollow(dt);if(G.poss===1){G.cpuT+=dt;if(G.cpuT>1.3){const toGo=(G.firstX-G.los)*dir(),dg=(goalX()-G.los)*dir();
   if(G.down===4&&!(toGo<=2&&dg<50)){if(dg+17<=44)cpuFG();else punt();return}
   snap(Math.random()<(toGo>6?.65:.42)?'pass':'run');}}return}
 // live
 G.pt+=dt;G.clock=Math.max(0,G.clock-dt);
 const d=dir(),o=G.poss,qb=ents.find(e=>e.role==='QB'&&e.side===o);
 // cpu qb throw
 if(o===1&&G.play==='pass'&&!carrier&&!ball&&G.pt>1.25){const tg=mostOpen(1);if(G.pt>2.6||Math.random()<dt*2)throwTo(tg);}
 const holder=carrier||(!ball?qb:null);
 // qb scramble past los
 if(G.play==='pass'&&!carrier&&!ball&&!G.thrown&&(qb.x-G.los)*d>.6){carrier=qb;}
 const[ix,iy]=inputVec();
 for(const e of ents){let tx=0,ty=0,sp=0;e.stun-=dt;e.spin-=dt;e.juke-=dt;e.shed-=dt;
  const isOff=e.side===o;
  if(e===ctrl){const base=e===carrier?7.7:(isOff?7.2:7.5);tx=ix*base;ty=iy*base;
   if(e.side===1&&carrier===null&&!ball){} // fine
  }else if(isOff){
   if(e===carrier){if(o===1){ // cpu runner
